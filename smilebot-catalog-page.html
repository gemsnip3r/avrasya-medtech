function buildScreens(){
 var out=[];
 PAGES.forEach(function(p){
  if(p.type==="product"){
   var a={},b={},k;for(k in p){a[k]=p[k];b[k]=p[k];}
   a.kind="showcase";b.kind="detail";out.push(a);out.push(b);
  }else{out.push(p);}
 });
 return out;
}
function pageHTML(p,i){
 var num=String(i+1).padStart(2,"0");
 if(p.type==="cover")return coverHTML();

 if(p.type==="traction")return tractionHTML(num);
 if(p.type==="product")return p.kind==="detail"?detailHTML(p,num):showcaseHTML(p,num);
 if(p.type==="overview")return overviewHTML(num);
 if(p.type==="subs")return subsHTML(num);
 if(p.type==="cta")return ctaHTML(num);
 return "";
}

function render(){
 var main=document.getElementById("catalog");
 var screens=buildScreens();
 main.innerHTML=screens.map(function(p,i){return pageHTML(p,i);}).join("");
 buildDots(screens.length);

}
function buildDots(n){
 var d=document.getElementById("dots"),h="";
 for(var i=0;i<n;i++){h+='<button data-i="'+i+'" aria-label="Page '+(i+1)+'"></button>';}
 d.innerHTML=h;
 d.querySelectorAll("button").forEach(function(b){b.onclick=function(){scrollToIndex(+b.dataset.i,false);};});
}
function initReveal(){
 var root=document.getElementById("catalog");
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{root:root,threshold:.12});
 root.querySelectorAll(".reveal").forEach(function(el){io.observe(el);});
}
function countUp(){
 var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
 var root=document.getElementById("catalog");
 root.querySelectorAll(".n[data-count]").forEach(function(el){
  var target=+el.dataset.count;
  if(reduce){el.textContent=fmt(target)+"+";return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){animateNum(el,target);io.unobserve(el);}});},{root:root,threshold:.5});
  io.observe(el);
 });
}
function animateNum(el,target){
 var dur=750,t0=performance.now();
 function step(now){var k=Math.min(1,(now-t0)/dur);var e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(target*e))+"+";if(k<1)requestAnimationFrame(step);}
 requestAnimationFrame(step);
}
function observeSections(){
 var root=document.getElementById("catalog");
 sections=Array.prototype.slice.call(document.querySelectorAll("#catalog .page"));
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){setActive(sections.indexOf(e.target));}});},{root:root,threshold:.55});
 sections.forEach(function(s){io.observe(s);});
}
function setActive(i){
 if(i<0)return;
 var light=sections[i].dataset.type==="light";
 document.getElementById("topbar").classList.toggle("on-light",light);
 document.getElementById("dots").classList.toggle("on-light",light);
 document.querySelectorAll("#dots button").forEach(function(b,bi){b.classList.toggle("active",bi===i);});
}
function currentIndex(){
 var c=document.getElementById("catalog");if(!sections.length)return 0;
 var y=c.scrollTop+c.clientHeight*0.5,best=0,bd=1e9;
 sections.forEach(function(s,i){var d=Math.abs(s.offsetTop+s.offsetHeight/2-y);if(d<bd){bd=d;best=i;}});
 return best;
}
function scrollToIndex(i,instant){
 var c=document.getElementById("catalog"),s=sections[i];if(!s)return;
 c.scrollTo({top:s.offsetTop,behavior:instant?"auto":"smooth"});
}

 }

}

async function buildPDF(){
 var isPortrait=window.matchMedia("(max-width:768px)").matches;
 var orient=isPortrait?"portrait":"landscape";
 var W=isPortrait?992:1400,H=isPortrait?1402:1050;
 showToast(true);
 try{
  await ensureFonts();
  await ensureLibs();
  var L=LANGS.find(function(l){return l.code===cur;});
  var rtl=L.rtl;
  var stage=document.getElementById("pdfStage");
  stage.dir=rtl?"rtl":"ltr";
  var screens=buildScreens();
  var total=screens.length;
  stage.innerHTML=screens.map(function(p,i){
   var light=(p.type==="overview"||p.type==="cta"||p.type==="subs");
   var center=(p.type==="cover"||p.type==="cta");
   var bg=p.bg?IMG+p.bg:"";
   var ov;
   if(p.type==="product"&&p.kind==="showcase")ov="background:linear-gradient(180deg,rgba(5,16,33,.28),rgba(5,16,33,.05) 38%,rgba(5,16,33,.82))";
   else if(p.type==="product"&&p.kind==="detail")ov="background:linear-gradient(180deg,rgba(5,16,33,.9),rgba(5,16,33,.82) 42%,rgba(6,20,42,.92))";
   else if(light)ov="background:linear-gradient(160deg,#eef4fd,#cddef3)";
   else ov="";
   return '<div class="pdfpage" '+(rtl?'dir="rtl"':'')+' style="width:'+W+'px;height:'+H+'px;background-image:url(\''+bg+'\')">'
    +'<div class="ov" style="'+ov+'"></div>'
    +'<div class="pin" style="'+(center?'justify-content:center':'')+'">'
    +'<div class="ph"><img src="'+(light?LOGO_B:LOGO_W)+'" crossorigin="anonymous"><span class="pno" style="'+(light?'color:#26405f':'')+'">'+String(i+1).padStart(2,"0")+' / '+String(total).padStart(2,"0")+'</span></div>'
    +'<div class="pbody" style="'+(center?'margin-top:0;':'')+(light?'color:#0C2D52':'')+'">'+pdfBody(p,W)+'</div>'
    +'</div></div>';
  }).join("");
  await preloadImages(stage);
  await new Promise(function(r){setTimeout(r,80);});
  var JsPDF=getJsPDF();
  if(typeof window.html2canvas==="undefined"||!JsPDF)throw new Error("PDF library could not be loaded (it may be blocked by the site's network/security policy).");
  var pdf=new JsPDF({orientation:orient,unit:"px",format:[W,H],compress:true});
  var pages=stage.querySelectorAll(".pdfpage");
  for(var i=0;i<pages.length;i++){
   var canvas=await html2canvas(pages[i],{scale:2,useCORS:true,backgroundColor:"#0a1f3a",logging:false,width:W,height:H,windowWidth:W,windowHeight:H});
   var img=canvas.toDataURL("image/jpeg",0.9);
   if(i>0)pdf.addPage([W,H],orient);
   pdf.addImage(img,"JPEG",0,0,W,H);
  }
  pdf.save("SMILEBOT-Catalog-"+cur.toUpperCase()+".pdf");
  stage.innerHTML="";
 }catch(err){
  console.error(err);
  alert("PDF: "+(err&&err.message?err.message:err)+"\n\nNote: images export correctly once the page is hosted at smile.tr (same origin).");
 }finally{showToast(false);}
}

function init(){
 var nav=(navigator.language||"en").slice(0,2).toLowerCase();
 cur=LANGS.find(function(l){return l.code===nav;})?nav:"en";
 syncControls();buildLangMenu();render();
 var cat=document.getElementById("catalog");
 cat.addEventListener("scroll",function(){
  var max=cat.scrollHeight-cat.clientHeight;
  document.getElementById("progress").style.width=(max>0?cat.scrollTop/max*100:0)+"%";
  document.getElementById("topbar").classList.toggle("scrolled",cat.scrollTop>10);
 },{passive:true});
 var langBtn=document.getElementById("langBtn"),langMenu=document.getElementById("langMenu");
 langBtn.addEventListener("click",function(e){e.stopPropagation();var open=langMenu.classList.toggle("open");langBtn.setAttribute("aria-expanded",open?"true":"false");});
 document.addEventListener("click",function(e){if(!langMenu.contains(e.target)&&e.target!==langBtn&&!langBtn.contains(e.target))closeLangMenu();});
 document.addEventListener("keydown",function(e){if(e.key==="Escape")closeLangMenu();});
 document.getElementById("pdfBtn").addEventListener("click",buildPDF);
}
init();
</script>
