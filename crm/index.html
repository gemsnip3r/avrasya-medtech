<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f4"><title>Avrasya MedTech CRM</title><style>html,body{margin:0;min-height:100%;background:#f4f8f5;color:#0a6f52;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.mark{width:50px;height:50px;margin:0 auto 16px;border-radius:17px;background:linear-gradient(145deg,#e5f8ef,#17a778);box-shadow:0 16px 36px #118a6326}.spin{width:40px;height:40px;margin:18px auto;border:3px solid #118a6318;border-top-color:#118a63;border-radius:50%;animation:r .9s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:20px;margin:0 0 6px}p{margin:0;color:#718178}</style></head><body><div id="boot"><div><div class="mark"></div><h1>Avrasya CRM</h1><div class="spin"></div><p>Güvenli çalışma alanı yükleniyor…</p></div></div><script>(async()=>{try{const parts=await Promise.all([0,1].map(i=>fetch('/crm/emerald-parts/'+i+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('CRM parçası yüklenemedi');return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw Error('Tarayıcı gzip açmayı desteklemiyor');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('boot').innerHTML='<div><div class="mark"></div><h1>CRM yüklenemedi</h1><p>Sayfayı yenileyin veya güncel bir tarayıcıyla tekrar deneyin.</p></div>'}})();</script></body></html>
