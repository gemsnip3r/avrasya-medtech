<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avrasya MedTech CRM</title><style>html,body{margin:0;background:#050817;color:#fff;font:14px system-ui}#boot{min-height:100vh;display:grid;place-items:center}.spin{width:42px;height:42px;border:3px solid #ffffff22;border-top-color:#7c5cff;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div id="boot"><div><div class="spin"></div><p>CRM yükleniyor…</p></div></div><script>(async()=>{try{let a=await Promise.all([0,1,2].map(i=>fetch('/crm/parts/'+i+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Parça yüklenemedi');return r.text()})));document.open();document.write(a.join(''));document.close()}catch(e){document.getElementById('boot').innerHTML='<p>CRM yüklenemedi. Lütfen sayfayı yenileyin.</p>';console.error(e)}})()</script></body></html>
