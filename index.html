<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ea"><title>Avrasya MedTech | Dijital Klinik</title><style>html,body{margin:0;min-height:100%;background:#f5f2ea;color:#183d6e;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.logo{width:54px;height:54px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(145deg,#fff,#dff5e8);box-shadow:0 16px 40px #183d6e22;display:grid;place-items:center;font-weight:900}.spin{width:42px;height:42px;margin:18px auto;border:3px solid #183d6e18;border-top-color:#183d6e;border-radius:50%;animation:r .9s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 6px}p{color:#6b7780;margin:0}</style><script src="/showroom/source-patch.js?v=20260812-2"></script><script src="/showroom/module-patch.js?v=20260812-1"></script></head><body><div id="boot"><div><div class="logo">AM</div><h1>Dijital Klinik hazırlanıyor</h1><div class="spin"></div><p>İnteraktif showroom yükleniyor…</p></div></div><script>(async()=>{try{const paths=['/showroom/parts/0.txt','/showroom/parts/1.txt','/showroom/parts/2.txt','/showroom/parts/3.txt','/showroom/parts/4a.txt','/showroom/parts/5.txt'];const parts=await Promise.all(paths.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Showroom parçası yüklenemedi: '+p);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');if(b64.length!==84852)throw Error('Showroom payload boyutu doğrulanamadı: '+b64.length);const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw Error('Tarayıcı gzip açmayı desteklemiyor');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();if(typeof window.patchAvrasyaHtml!=='function')throw Error('Showroom repair patch yüklenemedi');html=window.patchAvrasyaHtml(html);document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('boot').innerHTML='<div><div class="logo">AM</div><h1>Showroom yüklenemedi</h1><p>'+String(e.message||e)+'</p></div>'}})();</script></body></html>
